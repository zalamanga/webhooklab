name: Verify WebhookLab
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: webhooklab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: webhooklab_test
          POSTGRES_USER: webhooklab_test
          POSTGRES_PASSWORD: ci-isolated-database-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U webhooklab_test -d webhooklab_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: backend/go.sum
      - name: Go unit and actual PostgreSQL integration tests
        working-directory: backend
        env:
          WEBHOOK_TEST_DB_URL: postgres://webhooklab_test:ci-isolated-database-only@127.0.0.1:5432/webhooklab_test?sslmode=disable
          GOMAXPROCS: "2"
        run: go test -race -count=1 -v ./...
      - name: Static Go analysis
        working-directory: backend
        run: go vet ./...
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: node generate-csp.mjs
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
  browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEBHOOK_DB_PASSWORD: ci-local-postgresql-container-only
      WEBHOOK_DEMO_PASSWORD: ci-synthetic-webhook-operator-only
      WEBHOOK_SIGNING_SECRET: ci-synthetic-signing-key-no-real-integrations
      WEBHOOK_APP_ORIGIN: http://127.0.0.1:8097
      WEBHOOK_BASE_URL: http://127.0.0.1:8097
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build Go services
        run: docker compose build api
      - name: Build static Next.js and Nginx
        run: docker compose build web
      - name: Start actual local services
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Browser workflows and responsive checks
        working-directory: frontend
        run: npm run test:e2e
      - name: Kill and recover worker after committed receiver effect
        run: node scripts/recovery-probe.mjs
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 60
      - name: Stop isolated CI services
        if: always()
        run: docker compose down
